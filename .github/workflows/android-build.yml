name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK platform
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Android Firebase configuration
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          config = Path("android/app/google-services.json")
          if not config.is_file():
              with ZipFile("FamillePlanning-Android.zip") as archive:
                  names = [n for n in archive.namelist() if n.endswith("/app/google-services.json") or n == "app/google-services.json"]
                  if not names:
                      raise RuntimeError("google-services.json missing from both Android directory and AI Studio ZIP")
                  config.parent.mkdir(parents=True, exist_ok=True)
                  config.write_bytes(archive.read(names[0]))
          data = json.loads(config.read_text())
          assert data["project_info"]["project_id"] == "gen-lang-client-0548701351"
          assert any(client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "fr.familleplanning.app" for client in data.get("client", []))
          print("Firebase Android configuration verified")
          PY
      - name: Restore test-only Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familleplanning-android-debug-key-v1
      - name: Prepare stable debug signing and display SHA fingerprints
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=FamillePlanning,C=FR" -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -E 'SHA1:|SHA256:'
      - name: Check Google OAuth client configuration
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json") as fp:
              cfg = json.load(fp)
          oauth_types = sorted(set(client.get("client_type") for app in cfg.get("client", []) for client in app.get("oauth_client", [])))
          print("OAuth client types in Firebase config:", oauth_types)
          if 3 not in oauth_types:
              print("WARNING: Missing OAuth WEB client (type 3). Google sign-in will not work until Firebase OAuth is configured and google-services.json refreshed.")
          PY
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sed -n 's/.*SHA1: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_SHA="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK signing key does not match the cached debug key!"
            exit 1
          fi
          echo "APK certificate matches stable debug key"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FamillePlanning-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
