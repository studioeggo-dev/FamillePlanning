name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK platform
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify official Firebase Android configuration
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          file = Path("android/app/google-services.json")
          backup = Path(".github/familleplanning-android-firebase-config.json")
          if not file.exists():
              if not backup.exists():
                  raise RuntimeError("Firebase Android config is missing from both app and verified backup")
              backup_cfg = json.loads(backup.read_text())
              if backup_cfg.get("project_info", {}).get("project_number") != "583230474913":
                  raise RuntimeError("Untrusted backup: Firebase Android project number mismatch")
              file.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(backup, file)
              print("Firebase Android config restored from verified GitHub backup")
          cfg = json.loads(file.read_text())
          assert cfg["project_info"]["project_id"] == "gen-lang-client-0548701351", "Wrong Firebase project"
          assert cfg["project_info"]["project_number"] == "583230474913", "Wrong Firebase project number"
          clients = [c for c in cfg.get("client", []) if c.get("client_info",{}).get("android_client_info",{}).get("package_name") == "fr.familleplanning.app"]
          assert len(clients) == 1, "Android package missing or duplicated"
          oauth = clients[0].get("oauth_client", [])
          assert any(c.get("client_type") == 3 for c in oauth), "Missing Web OAuth client"
          expected_sha = "519c7845edd61c2cb0d10eb77cdc7d18e5367a1b"
          assert any(c.get("client_type") == 1 and c.get("android_info", {}).get("certificate_hash", "").lower() == expected_sha for c in oauth), "Missing Android OAuth client with expected SHA-1"
          print("Firebase project, Android OAuth client and signing fingerprint validated")
          PY
      - name: Restore test-only Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familleplanning-android-debug-key-v1
      - name: Prepare stable debug signing and display SHA fingerprints
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=FamillePlanning,C=FR" -noprompt
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -E 'SHA1:|SHA256:'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sed -n 's/.*SHA1: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_SHA="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK signing key does not match the cached debug key!"
            exit 1
          fi
          echo "APK certificate matches stable debug key"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FamillePlanning-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
