name: Firebase family functions tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/family-functions-test.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/family-functions-test.yml'

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: |
          node --check functions/index.js
          node --check functions/inviteCore.js
      - name: Run family token and parental cap tests
        run: node --test functions/test/*.test.js
